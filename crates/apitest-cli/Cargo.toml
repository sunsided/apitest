[package]
name = "apitest-cli"
description = "Command-line runner for apitest suites"
readme = "README.md"
keywords = ["api", "testing", "openapi", "load-testing", "cli"]
categories = ["development-tools::testing", "command-line-utilities"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "apitest"
path = "src/main.rs"
# The library docs live under the same name; the binary has no API to document.
doc = false

[dependencies]
apitest = { workspace = true, features = ["rhai", "js", "load", "diagnostics"] }
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap = { version = "4.6", features = ["derive"] }

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json", "query"] }

[lints]
workspace = true
