[package]
name = "apitest-macros"
description = "Attribute macros for apitest: #[apitest::test], #[apitest::fixture], #[apitest::suite]"
readme = "README.md"
keywords = ["api", "testing", "fixtures", "proc-macro"]
categories = ["development-tools::testing", "development-tools::procedural-macro-helpers"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }

[lints]
workspace = true
