[package]
name = "apitest-macros"
description = "Attribute macros for apitest: #[apitest::test], #[apitest::fixture], #[apitest::suite]"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
