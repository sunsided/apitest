# https://taskfile.dev
# Keep `ci` in sync with .github/workflows/ci.yml: same checks, same flags.
version: '3'

includes:
  fuzz:
    taskfile: fuzz/Taskfile.dist.yaml
    dir: fuzz
    optional: true

vars:
  # Prefer cargo-nextest when installed; fall back to cargo test.
  NEXTEST:
    sh: cargo nextest --version >/dev/null 2>&1 && echo yes || echo no
  # Branching model checked by lint:branch: github (main + feature/) or gitflow.
  BRANCH_FLOW: github
  # apitest-py is a pyo3 extension module: its test binary cannot link without libpython.
  # It is built and tested through maturin instead (py:test).
  TEST_SCOPE: --workspace --exclude apitest-py --all-features

env:
  # Newer nextest fails when a crate has no tests; warn instead (ignored by older versions).
  NEXTEST_NO_TESTS: warn

tasks:
  default:
    cmds:
      - task --list --sort=none
    silent: true

  build:
    desc: Build all targets in the workspace
    cmds:
      - cargo build {{.TEST_SCOPE}} --all-targets {{.CLI_ARGS}}

  test:
    desc: Run tests (nextest if installed, cargo test otherwise), then doctests
    cmds:
      - cmd: cargo nextest run {{.TEST_SCOPE}} {{.CLI_ARGS}}
        if: '[ "{{.NEXTEST}}" = "yes" ]'
      - cmd: cargo test {{.TEST_SCOPE}} --all-targets {{.CLI_ARGS}}
        if: '[ "{{.NEXTEST}}" = "no" ]'
      - task: test:doc

  test:doc:
    desc: Run doctests (nextest does not run them)
    aliases: [test:docs]
    cmds:
      - cargo test {{.TEST_SCOPE}} --doc

  test:features:
    desc: Check every apitest feature on its own (the library is lean by default)
    preconditions:
      - &hack
        sh: cargo hack --version
        msg: "cargo-hack not found - cargo install --locked cargo-hack"
    cmds:
      - cargo hack check -p apitest --each-feature --no-dev-deps

  py:test:
    desc: Build the Python extension with maturin into .venv and run pytest
    preconditions:
      - sh: command -v python3
        msg: "python3 not found"
    cmds:
      - cargo build -p apitest --example demo_server
      - '[ -d .venv ] || python3 -m venv .venv'
      - .venv/bin/pip install --quiet maturin pytest
      - cd crates/apitest-py && ../../.venv/bin/maturin develop --quiet && ../../.venv/bin/pytest -v

  npm:check:
    desc: Type-check the JS demo suites against the published TypeScript declarations
    preconditions:
      - &node
        sh: command -v npx
        msg: "Node.js not found - https://nodejs.org/"
    cmds:
      - npx --yes -p typescript@5.8.3 tsc -p demo/suites/jsconfig.json

  npm:smoke:
    desc: Pack the npm launcher and the host platform package, install them and run the CLI
    preconditions:
      - *node
    vars:
      TARGET:
        sh: "rustc -vV | sed -n 's/^host: //p'"
    cmds:
      - cargo build -p apitest-cli
      - |
        set -e
        tmp=$(mktemp -d)
        node npm/scripts/build-platform-package.mjs --target "{{.TARGET}}" --binary target/debug/apitest --out "$tmp/dist"
        (cd npm/cli && npm pack --pack-destination "$tmp")
        for pkg in "$tmp"/dist/*/; do (cd "$pkg" && npm pack --pack-destination "$tmp"); done
        mkdir "$tmp/proj"
        cd "$tmp/proj"
        npm init -y >/dev/null
        npm i --omit=optional "$tmp"/*.tgz
        npx apitest --version
        npx apitest contract diff "{{.ROOT_DIR}}/demo/specs/billing-1.0.yaml" "{{.ROOT_DIR}}/demo/specs/billing-1.1.yaml"
        rm -rf "$tmp"

  fmt:
    desc: Format all Rust sources
    cmds:
      - cargo fmt --all
      - task: fuzz:fmt

  fmt:check:
    desc: Check formatting without modifying files
    cmds:
      - cargo fmt --all --check

  lint:
    desc: Run all linters
    cmds:
      - task: lint:clippy
      - task: lint:separators
      - task: lint:readme
      - task: lint:typos
      - task: lint:review
      - task: lint:actions

  lint:clippy:
    desc: Clippy (pedantic, warnings as errors)
    cmds:
      - cargo clippy --workspace --all-targets --all-features -- -D warnings

  lint:fix:
    desc: Auto-fix clippy findings and typos, then format (review the diff)
    cmds:
      - cargo clippy --workspace --all-targets --all-features --fix --allow-dirty --allow-staged
      - typos --write-changes
      - task: fmt

  lint:separators:
    desc: Fail on `// ----` style separator comments (split the file into modules instead)
    cmds:
      - "! grep -rnE --include='*.rs' --exclude-dir=target --exclude-dir=.git '^[[:space:]]*//+[[:space:]]*[-=*#~_/]{4,}' ."

  lint:readme:
    desc: Fail on relative links or images in README files (crates.io needs absolute URLs)
    cmds:
      # `if` instead of `! a | b`: Task's shell does not negate pipelines like bash does.
      - |
        # docs/review/README.md is a GitHub-only index with generated relative links.
        if grep -rnoE --include='README.md' --exclude-dir=target --exclude-dir=.git --exclude-dir=review --exclude-dir=node_modules '(\]\(|src=")[^)"]*' . \
          | grep -vE ':(\]\(|src=")(https?://|#|mailto:)'; then
          echo "use absolute URLs for these links (docs/readme.md)"
          exit 1
        fi

  lint:typos:
    desc: Spell-check code and docs
    preconditions:
      - sh: command -v typos
        msg: "typos not found - cargo install --locked typos-cli"
    cmds:
      - typos

  lint:review:
    desc: Check that docs/review/ index and generated Copilot instructions are current
    cmds:
      - python3 scripts/review-index.py --check

  review:index:
    desc: Regenerate docs/review/README.md and .github/instructions/ from the review topics
    cmds:
      - python3 scripts/review-index.py

  lint:branch:
    desc: Check the branch name against the branching model (BRANCH=..., default current)
    cmds:
      - sh scripts/check-branch.sh "{{.BRANCH}}" "{{.BRANCH_FLOW}}"

  lint:actions:
    desc: Lint GitHub Actions workflows (actionlint + zizmor)
    preconditions:
      - sh: command -v actionlint
        msg: "actionlint not found - https://github.com/rhysd/actionlint/blob/main/docs/install.md"
      - sh: command -v zizmor
        msg: "zizmor not found - https://docs.zizmor.sh/installation/"
    cmds:
      - actionlint
      - zizmor .github/

  doc:
    desc: Build docs including private items, warnings as errors
    aliases: [docs]
    env:
      RUSTDOCFLAGS: -D warnings
    cmds:
      - cargo doc --workspace --all-features --no-deps --document-private-items

  deny:
    desc: Check advisories, licenses, bans and sources
    preconditions:
      - sh: cargo deny --version
        msg: "cargo-deny not found - cargo install --locked cargo-deny"
    cmds:
      - cargo deny --all-features check

  msrv:
    desc: Check every crate on its declared rust-version
    preconditions:
      - *hack
    cmds:
      - cargo hack check --rust-version --workspace --all-targets --ignore-private

  semver:
    desc: Check published library crates for semver violations
    preconditions:
      - sh: cargo semver-checks --version
        msg: "cargo-semver-checks not found - cargo install --locked cargo-semver-checks"
    cmds:
      - cargo semver-checks --workspace

  coverage:
    desc: Coverage report (lcov.info, gitignored; HTML with -- --html)
    preconditions:
      - sh: cargo llvm-cov --version
        msg: "cargo-llvm-cov not found - cargo install --locked cargo-llvm-cov"
    cmds:
      - cmd: cargo llvm-cov nextest {{.TEST_SCOPE}} --lcov --output-path lcov.info {{.CLI_ARGS}}
        if: '[ "{{.NEXTEST}}" = "yes" ]'
      - cmd: cargo llvm-cov {{.TEST_SCOPE}} --lcov --output-path lcov.info {{.CLI_ARGS}}
        if: '[ "{{.NEXTEST}}" = "no" ]'

  bench:
    desc: "Run benchmarks (criterion flags after --: task bench -- --quick)"
    cmds:
      # --bench '*': only [[bench]] targets (--benches would include lib harnesses that reject criterion flags).
      - cargo bench --workspace --bench '*' -- {{.CLI_ARGS}}

  # GitVersion owns the version (CONTRIBUTING.md, Releasing).
  version:
    desc: Print the version GitVersion computes for the current commit
    env:
      DO_NOT_TRACK: '1'
    preconditions:
      - &gitversion
        sh: command -v dotnet-gitversion
        msg: "GitVersion not found - dotnet tool install -g GitVersion.Tool"
    cmds:
      - dotnet-gitversion --show-variable SemVer

  release:tag:
    desc: "Tag a stable release vX.Y.Z from GitVersion (PRE=1: tag the pre-release, e.g. vX.Y.Z-beta.N)"
    env:
      DO_NOT_TRACK: '1'
    preconditions:
      - *gitversion
      - sh: git diff --quiet && git diff --cached --quiet
        msg: "Working tree is not clean"
      - sh: '[ "$(git rev-parse --abbrev-ref HEAD)" = main ] || git rev-parse --abbrev-ref HEAD | grep -qE "^(release|hotfix)/"'
        msg: "Tag from main or a release/hotfix branch"
    vars:
      VERSION:
        sh: DO_NOT_TRACK=1 dotnet-gitversion --show-variable {{if .PRE}}SemVer{{else}}MajorMinorPatch{{end}}
    prompt: "Create and push tag v{{.VERSION}}? This publishes to crates.io and npm and creates the GitHub Release."
    cmds:
      - git tag -a "v{{.VERSION}}" -m "Release {{.VERSION}}"
      - git push origin "v{{.VERSION}}"

  dist:
    desc: Build the release binary with cargo auditable (dependency tree embedded)
    preconditions:
      - sh: cargo auditable --version
        msg: "cargo-auditable not found - cargo install --locked cargo-auditable"
    cmds:
      - cargo auditable build --release --locked -p apitest-cli {{.CLI_ARGS}}

  dist:sbom:
    desc: Write a CycloneDX SBOM extracted from the built binary
    preconditions:
      - sh: command -v auditable2cdx
        msg: "auditable2cdx not found - cargo install --locked auditable2cdx"
    deps: [dist]
    cmds:
      - auditable2cdx target/release/apitest > target/release/apitest.cdx.json

  ci:
    desc: Run the CI checks locally (mirrors .github/workflows/ci.yml)
    cmds:
      - task: lint:branch
      - task: fmt:check
      - task: lint
      - task: doc
      - task: test
      - task: test:features
      - task: deny
      - task: msrv
      - task: npm:check
      - task: npm:smoke
      - task: py:test
      - task: fuzz:build
      - task: fuzz:lint

  clean:
    desc: Remove build output, including fuzz builds (keeps fuzz corpora and crash artifacts)
    cmds:
      - cargo clean
      - task: fuzz:clean
      - rm -f lcov.info
