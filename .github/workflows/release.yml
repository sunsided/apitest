# DRAFT: builds the CLI for all npm platforms and publishes @apitest/cli.
# Runs on version tags (v0.3.1). Needs an NPM_TOKEN secret with publish rights on
# the @apitest scope.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm provenance

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-13 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, exe: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p apitest-cli --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: apitest-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/apitest${{ matrix.exe }}

  npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Set version from tag
        run: node npm/scripts/set-version.mjs "${GITHUB_REF_NAME}"
      - name: Build platform packages
        run: |
          for dir in artifacts/apitest-*; do
            target="${dir#artifacts/apitest-}"
            bin=$(ls "$dir"/apitest* | head -1)
            node npm/scripts/build-platform-package.mjs --target "$target" --binary "$bin" --out npm/dist
          done
      # Platform packages first: the wrapper's optionalDependencies must resolve.
      - name: Publish platform packages
        run: for pkg in npm/dist/*/; do npm publish "$pkg" --access public --provenance; done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @apitest/cli
        run: npm publish npm/cli --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Archive binaries
        run: |
          mkdir dist
          for dir in artifacts/apitest-*; do
            target="${dir#artifacts/apitest-}"
            tar -C "$dir" -czf "dist/apitest-${GITHUB_REF_NAME}-${target}.tar.gz" .
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
