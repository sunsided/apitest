name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features apitest/full -- -D warnings
      - run: cargo build -p apitest --no-default-features
      - run: cargo build -p apitest
      - run: cargo build -p apitest-cli
      - run: cargo test -p apitest --features full
        env:
          APITEST_JUNIT: target/apitest/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: target/apitest/junit.xml

  nextest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # Process-per-test: exercises the cross-process serial/resource locks.
      - run: cargo nextest run -p apitest --features full --test macro_harness --test nextest_locks --test billing_harness --test care_flow --test-threads 8

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Type-check the JS demo suite against the published declarations
        run: npx -y -p typescript@5.8.3 tsc -p demo/suites/jsconfig.json
      - name: Pack and run through the launcher
        run: |
          cargo build -p apitest-cli
          node npm/scripts/build-platform-package.mjs --target x86_64-unknown-linux-gnu --binary target/debug/apitest --out "$RUNNER_TEMP/dist"
          (cd npm/cli && npm pack --pack-destination "$RUNNER_TEMP")
          (cd "$RUNNER_TEMP/dist/cli-linux-x64-gnu" && npm pack --pack-destination "$RUNNER_TEMP")
          mkdir "$RUNNER_TEMP/proj" && cd "$RUNNER_TEMP/proj" && npm init -y
          npm i --omit=optional "$RUNNER_TEMP"/apitest-cli-0.0.1.tgz "$RUNNER_TEMP"/apitest-cli-linux-x64-gnu-0.0.1.tgz
          npx apitest --version
          npx apitest contract diff "$GITHUB_WORKSPACE/demo/specs/billing-1.0.yaml" "$GITHUB_WORKSPACE/demo/specs/billing-1.1.yaml"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build -p apitest --example demo_server
      - run: python -m venv .venv && .venv/bin/pip install maturin pytest
      - run: . .venv/bin/activate && cd crates/apitest-py && maturin develop && pytest -v
