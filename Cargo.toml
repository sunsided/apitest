[workspace]
resolver = "3"
members = ["crates/apitest", "crates/apitest-cli", "crates/apitest-macros", "crates/apitest-py"]
default-members = ["crates/apitest", "crates/apitest-cli"]

[workspace.package]
version = "0.1.0-alpha"
edition = "2024"
license = "EUPL-1.2 OR MIT OR Apache-2.0"
repository = "https://github.com/sunsided/apitest"
rust-version = "1.95"

[workspace.dependencies]
apitest = { version = "0.1.0-alpha", path = "crates/apitest", default-features = false }
apitest-macros = { version = "0.1.0-alpha", path = "crates/apitest-macros" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }

[workspace.lints.rust]
missing_docs = "warn"
# Safe by default. If a crate needs unsafe, use "deny" here instead and scope
# #[expect(unsafe_code, reason = "...")] to the smallest item (forbid cannot be overridden).
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_docs_in_private_items = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cognitive_complexity = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"
