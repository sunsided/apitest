[package]
name = "apitest-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# A separate workspace: fuzzing needs nightly and stays out of the root workspace.
[workspace]

[dependencies]
apitest = { path = "../crates/apitest", default-features = false }
libfuzzer-sys = "0.4"

# Copied from the root [workspace.lints]: `workspace = true` does not reach this separate workspace.
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_docs_in_private_items = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cognitive_complexity = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"

[[bin]]
name = "spec_from_bytes"
path = "fuzz_targets/spec_from_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "drift_diff"
path = "fuzz_targets/drift_diff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nova_config"
path = "fuzz_targets/nova_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "traceparent"
path = "fuzz_targets/traceparent.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dotenv"
path = "fuzz_targets/dotenv.rs"
test = false
doc = false
bench = false
